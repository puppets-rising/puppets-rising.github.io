<!doctype html>
<html class="no-js" lang="en">

<head>
    <meta charset="utf-8">
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <title>Puppets Rising</title>
    <meta name="description" content="For accuracy in the recounting of a tale, some characters must be larger than life. ">


    <meta name="viewport" content="width=device-width, initial-scale=1">


    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <meta name="msapplication-TileColor" content="#FFFFFF" />
    <meta name="msapplication-TileImage" content="//cdn.fcim.org/sep/mapr/favicon/mstile-150x150.png" />


    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lacquer&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/css/meanie.css">

    <style>

    </style>
</head>

<body>

    <div class="meanie-wrap">
        <div class="meanie">
            <img src="img/meanie.png" alt="Open the Meanie" tabindex="0" role="button" />
        </div>

        <div class="meanie-open">
            <img src="img/meanie-head.png" alt="Close the Meanie" tabindex="0" role="button" />

            <div class="meanie-drop">
                <div class="meanie-body">
                    <div class="meanie-body-inner">
                        <img class="body-sizer" src="img/meanie-body.png" alt="" aria-hidden="true" />
                        <img class="body-art" src="img/meanie-body.png" alt="" />
                        <div class="meanie-text">
                            <div class="meanie-scroll" tabindex="0">

                                <h1>Welcome to the show! </h1>

                                <img class="inNene" src="img/flagpole.GIF" />

                                <p class="center"><a href="mailto:puppets-rising@proton.me">puppets-rising@proton.me</a></p>
<p class="city">Tallahassee, FL</p>
                            </div>
                        </div>
                    </div>
                    <img class="meanie-bottom" src="img/meanie-bottom.png" alt="" />
                </div>
            </div>
        </div>
        
    </div>

    <script>
        (function () {
            var wrap = document.querySelector('.meanie-wrap');
            var openTrigger = wrap.querySelector('.meanie img');
            var closeTrigger = wrap.querySelector('.meanie-open > img:first-child');
            var bottom = wrap.querySelector('.meanie-bottom');

            function open() {
                wrap.classList.remove('is-closing');
                wrap.classList.add('is-open');
            }

            function finishClose() {
                wrap.classList.remove('is-open', 'is-closing');
            }

            function close() {
                if (!wrap.classList.contains('is-open') || wrap.classList.contains('is-closing')) return;
                wrap.classList.add('is-closing');
                // no animation running (e.g. reduced motion): close straight away
                if (getComputedStyle(bottom).animationName === 'none') finishClose();
            }

            // when the closing animation of the bottom image ends, swap to the closed graphic
            bottom.addEventListener('animationend', function (e) {
                if (e.animationName === 'bottomCollapse') finishClose();
            });

            function bind(el, action) {
                el.addEventListener('click', action);
                el.addEventListener('keydown', function (e) {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        action();
                    }
                });
            }

            bind(openTrigger, open);
            bind(closeTrigger, close);
        })();
    </script>

</body>

</html>
